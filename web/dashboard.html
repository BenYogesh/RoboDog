<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8741a">
  <title id="page-title">RoboDog</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1b0d05;
      --panel: #3a1b0c;
      --panel-light: #572710;
      --border: #a9571f;
      --text: #fff8f0;
      --muted: #f0c7a2;
      --accent: #ff9d36;
      --good: #54d69a;
      --warning: #ffc857;
      --danger: #ff6b6b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 12% 0%, rgba(255, 145, 38, .34), transparent 32rem), radial-gradient(circle at 100% 20%, rgba(229, 81, 18, .18), transparent 30rem), linear-gradient(145deg, #2a1005 0%, var(--bg) 55%, #120601 100%);
      color: var(--text);
      font: 15px/1.35 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button {
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: .5rem .65rem;
      background: var(--panel-light);
      color: var(--text);
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
    }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:active:not(:disabled), button.active:not(:disabled) { background: #8b350b; transform: translateY(1px) scale(.98); }
    button:disabled { cursor: not-allowed; opacity: .42; }
    .shell { width: min(1180px, 100%); margin: 0 auto; padding: max(.7rem, env(safe-area-inset-top)) .75rem 1.25rem; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: .7rem; margin-bottom: .7rem; }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(1.5rem, 4vw, 2rem); letter-spacing: -.03em; }
    h2 { font-size: 1.05rem; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: .55rem; }
    .language { min-height: 38px; padding: .45rem .7rem; background: transparent; color: var(--accent); font-size: .8rem; }
    .strip { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .45rem; }
    .pill { display: inline-flex; align-items: center; min-height: 30px; padding: .25rem .65rem; border: 1px solid var(--border); border-radius: 999px; color: var(--muted); font-size: .78rem; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; }
    .pill.good { color: var(--good); border-color: rgba(84, 214, 154, .48); }
    .pill.warning { color: var(--warning); border-color: rgba(255, 200, 87, .48); }
    .pill.danger { color: var(--danger); border-color: rgba(255, 107, 107, .48); }
    .layout { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(280px, .8fr); grid-template-areas: "camera mode" "camera controls"; gap: .7rem; align-items: stretch; }
    .card { border: 1px solid var(--border); border-radius: 14px; padding: .7rem; background: rgba(58, 27, 12, .96); box-shadow: 0 12px 30px rgba(255, 105, 0, .22); }
    .camera-card { grid-area: camera; }
    .mode-card { grid-area: mode; }
    .controls-card { grid-area: controls; }
    .card-header { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-bottom: .5rem; }
    .detection-bar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .45rem; margin-bottom: .5rem; }
    .detection-item { display: flex; align-items: center; justify-content: space-between; gap: .5rem; min-width: 0; padding: .4rem .55rem; border: 1px solid var(--border); border-radius: 8px; background: rgba(92, 40, 14, .58); }
    .detection-label { color: var(--muted); font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .detection-value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 750; }
    .detection-value.good { color: var(--good); }
    .detection-value.warning { color: var(--warning); }
    .ball-detection-panel { margin-bottom: .5rem; padding: .45rem .55rem; border: 1px solid var(--border); border-radius: 8px; background: rgba(92, 40, 14, .58); }
    .ball-detection-header { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
    .ball-detection-objects-label { margin-top: .35rem; color: var(--muted); font-size: .68rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .ball-detection-objects { display: flex; flex-wrap: wrap; gap: .3rem; min-height: 1.35rem; margin-top: .25rem; }
    .object-chip { display: inline-flex; align-items: baseline; gap: .28rem; padding: .2rem .38rem; border: 1px solid rgba(255, 171, 72, .5); border-radius: 5px; background: rgba(29, 10, 2, .72); font-size: .75rem; font-weight: 650; }
    .object-confidence { color: var(--muted); font: 650 .67rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .object-empty { color: var(--muted); font-size: .75rem; }
    .camera-frame { position: relative; overflow: hidden; min-height: 220px; aspect-ratio: 4 / 3; border: 1px solid var(--border); border-radius: 12px; background: #100703; }
    .camera-frame img { display: block; width: 100%; height: 100%; min-height: 220px; object-fit: contain; }
    .camera-hint { position: absolute; inset: auto 0 0; padding: .5rem; background: linear-gradient(transparent, rgba(16, 7, 3, .94)); color: var(--muted); font-size: .78rem; }
    .mode-buttons, .button-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .45rem; }
    .mode-buttons button:first-child { background: #f47b16; border-color: #ffd08a; }
    .dpad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .4rem; max-width: 340px; margin: 0 auto; }
    .dpad .empty { visibility: hidden; }
    .dpad button { min-height: 50px; }
    .control-button { display: flex; align-items: center; justify-content: center; gap: .3rem; }
    .dpad .control-button { flex-direction: column; }
    .control-label { line-height: 1.15; }
    .key-hint { display: inline-flex; align-items: center; justify-content: center; min-width: 1.5rem; padding: .08rem .28rem; border: 1px solid rgba(255, 156, 61, .45); border-radius: 4px; background: rgba(19, 11, 6, .72); color: var(--accent); font: 700 .68rem/1.15 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .dpad .stop, .danger-button { background: #6d2634; border-color: #bd4b5b; }
    .group + .group { margin-top: .7rem; }
    .group-title { margin-bottom: .4rem; color: var(--muted); font-size: .72rem; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    .button-row.posture-actions { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .button-row.camera-controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .face-gate-toggle[aria-pressed="true"] { border-color: var(--good); color: var(--good); }
    .notice { min-height: 2.2rem; margin-top: .6rem; padding: .5rem .6rem; border-left: 3px solid var(--accent); border-radius: 8px; background: rgba(255, 145, 40, .15); color: var(--muted); font-size: .8rem; }
    .notice.ok { border-color: var(--good); color: var(--good); }
    .notice.error { border-color: var(--danger); color: var(--danger); }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; grid-template-areas: "camera" "mode" "controls"; } }
    @media (max-width: 520px) { .shell { padding-inline: .7rem; } header { display: block; } .strip { justify-content: flex-start; margin-top: .6rem; } .card { padding: .65rem; border-radius: 12px; } .camera-frame, .camera-frame img { min-height: 180px; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1 data-i18n="title">RoboDog</h1>
      </div>
      <div class="actions">
        <button id="language-button" class="language" type="button">Tiếng Việt</button>
        <div id="connection-strip" class="strip" aria-label="Connection status">
          <span id="connection-pill" class="pill" data-i18n="connecting">Connecting</span>
          <span id="mode-pill" class="pill" data-i18n="automatic">Automatic</span>
        </div>
      </div>
    </header>

    <main class="layout">
      <section class="card camera-card">
        <div class="card-header"><h2 data-i18n="camera">Camera</h2><span id="camera-state" class="pill" data-i18n="waiting">Waiting</span></div>
        <div class="detection-bar" aria-live="polite">
          <div class="detection-item"><span class="detection-label" data-i18n="face">Face</span><span id="detection-face" class="detection-value">—</span></div>
          <div class="detection-item"><span class="detection-label" data-i18n="hand">Hand</span><span id="detection-hand" class="detection-value">—</span></div>
        </div>
        <div class="ball-detection-panel" aria-live="polite">
          <div class="ball-detection-header"><span class="detection-label" data-i18n="ballDetection">Ball detection</span><span id="ball-detection-state" class="pill" data-i18n="ballInactive">Inactive</span></div>
          <div class="ball-detection-objects-label" data-i18n="detectedObjects">Detected objects</div>
          <div id="ball-detection-objects" class="ball-detection-objects"><span class="object-empty" data-i18n="noObjects">No objects detected</span></div>
        </div>
        <div class="camera-frame">
          <img id="camera-image" src="/camera.mjpg" alt="RoboDog camera feed">
          <div id="camera-hint" class="camera-hint" data-i18n="cameraLiveHint">Live camera feed.</div>
        </div>
      </section>

      <section class="card mode-card">
        <div class="card-header"><h2 data-i18n="controlMode">Control mode</h2></div>
        <div class="mode-buttons">
          <button id="manual-button" type="button" data-i18n="manualButton">Manual</button>
          <button id="automatic-button" type="button" data-i18n="automaticButton">Automatic</button>
        </div>
        <div id="notice" class="notice" role="status" aria-live="polite" data-i18n="connectingNotice">Dashboard is connecting to the UNO Q.</div>
      </section>

      <section class="card controls-card">
        <div class="card-header"><h2 data-i18n="robotControls">Robot controls</h2></div>
        <div class="group">
          <div class="group-title" data-i18n="movementHold">Press &amp; Hold</div>
          <div class="dpad">
            <span class="empty"></span><button class="hold-control control-button" data-command="forward" type="button"><span class="control-label" data-i18n="forward">Forward</span><kbd class="key-hint">W</kbd></button><span class="empty"></span>
            <button class="hold-control control-button" data-command="turn_left" type="button"><span class="control-label" data-i18n="turnLeft">Turn left</span><kbd class="key-hint">A</kbd></button><button class="stop control-button" data-command="stop" type="button"><span class="control-label" data-i18n="stop">STOP</span><kbd class="key-hint" data-i18n="space">Space</kbd></button><button class="hold-control control-button" data-command="turn_right" type="button"><span class="control-label" data-i18n="turnRight">Turn right</span><kbd class="key-hint">D</kbd></button>
            <button class="hold-control control-button" data-command="crab_left" type="button"><span class="control-label" data-i18n="strafeLeft">Strafe left</span><kbd class="key-hint">Q</kbd></button><button class="hold-control control-button" data-command="backward" type="button"><span class="control-label" data-i18n="backward">Backward</span><kbd class="key-hint">S</kbd></button><button class="hold-control control-button" data-command="crab_right" type="button"><span class="control-label" data-i18n="strafeRight">Strafe right</span><kbd class="key-hint">E</kbd></button>
          </div>
        </div>
        <div class="group"><div class="group-title" data-i18n="postures">Postures</div><div class="button-row posture-actions"><button class="control-button" data-command="stand" type="button"><span class="control-label" data-i18n="stand">Stand</span><kbd class="key-hint">X</kbd></button><button class="control-button" data-command="sit" type="button"><span class="control-label" data-i18n="sit">Sit</span><kbd class="key-hint">C</kbd></button><button class="control-button" data-command="prone" type="button"><span class="control-label" data-i18n="prone">Prone</span><kbd class="key-hint">V</kbd></button><button class="control-button" data-command="hold" type="button"><span class="control-label" data-i18n="hold">Hold</span><kbd class="key-hint">Z</kbd></button><button class="control-button" data-command="bounce" type="button"><span class="control-label" data-i18n="bounce">Bounce</span><kbd class="key-hint">B</kbd></button></div></div>
        <div class="group"><div class="group-title" data-i18n="camera">Camera</div><div class="button-row camera-controls"><button class="control-button" data-command="camera_up" type="button"><span class="control-label" data-i18n="cameraUp">Up</span><kbd class="key-hint">I</kbd></button><button class="control-button" data-command="camera_down" type="button"><span class="control-label" data-i18n="cameraDown">Down</span><kbd class="key-hint">K</kbd></button><button id="camera-restart-button" class="control-button" type="button"><span class="control-label" data-i18n="restartCamera">Restart camera</span></button><button id="face-gate-toggle-button" class="control-button face-gate-toggle" type="button" aria-pressed="true"><span class="control-label" data-i18n="faceGateRequired">Require familiar face</span></button></div></div>
      </section>
    </main>
  </div>

  <script>
    (() => {
      const translations = {
          en: {
          title: "RoboDog", switchLanguage: "Tiếng Việt", switchLanguageAria: "Switch to Vietnamese", connectionStatus: "Connection status", connecting: "Connecting", connected: "Connected", offline: "Offline", inUse: "In use", automatic: "Automatic", dashboard: "Dashboard", bluetooth: "Bluetooth", manual: "Manual", unknown: "Unknown", camera: "Camera", live: "Live", waiting: "Waiting", cameraLiveHint: "Live camera feed.", cameraWaitingHint: "Waiting for camera frames.", cameraAlt: "RoboDog camera feed", restartCamera: "Restart camera", cameraRestartRequested: "Camera restart requested.", faceGateRequired: "Require familiar face", faceGateOpen: "Allow any face", faceGateRequiredHint: "Gestures require a familiar face", faceGateOpenHint: "Gestures can be used without a familiar face", faceGateRequiredNotice: "Familiar face requirement enabled.", faceGateOpenNotice: "Familiar face requirement disabled.", controlMode: "Control mode", manualButton: "Manual", automaticButton: "Automatic", connectingNotice: "Dashboard is connecting to the UNO Q.", dashboardControlActive: "Dashboard control is active.", automaticRestored: "Automatic control restored.", dashboardBusy: "Dashboard is currently in use by another device.", bluetoothOwns: "Bluetooth currently owns manual control.", acceptedCommand: "Accepted: {command}", requestFailed: "Request failed ({status})", robotControls: "Robot controls", movementHold: "Press & Hold", forward: "Forward", turnLeft: "Turn left", stop: "STOP", turnRight: "Turn right", strafeLeft: "Strafe left", backward: "Backward", strafeRight: "Strafe right", postures: "Postures", stand: "Stand", sit: "Sit", prone: "Prone", hold: "Hold", bounce: "Bounce", cameraUp: "Up", cameraDown: "Down", space: "Space", ballDetection: "Ball detection", ballInactive: "Inactive", ballSearching: "Searching", ballTracking: "Tracking ball", ballFound: "Ball found", ballLost: "Lost ball", ballNotFound: "Ball not found", detectedObjects: "Detected objects", noObjects: "No objects detected", neutral: "Neutral", stopScan: "Stop scan", status: "Status", control: "Control", robotState: "Robot state", face: "Face", hand: "Hand", faceFamiliar: "Familiar", faceUnfamiliar: "Unfamiliar", faceNone: "Not detected", lastCommand: "Last command", scan: "Camera scan", cameraHealth: "Camera feed", cameraRestarts: "Camera restarts", cameraRestartReason: "Last restart", cameraPath: "Camera device", noErrors: "No errors reported.", detected: "Detected", notDetected: "Not detected" },
          vi: {
          title: "RoboDog", switchLanguage: "English", switchLanguageAria: "Chuyển sang tiếng Anh", connectionStatus: "Trạng thái kết nối", connecting: "Đang kết nối", connected: "Đã kết nối", offline: "Ngoại tuyến", inUse: "Đang được sử dụng", automatic: "Tự động", dashboard: "Bảng điều khiển", bluetooth: "Bluetooth", manual: "Thủ công", unknown: "Không rõ", camera: "Camera", live: "Trực tiếp", waiting: "Đang chờ", cameraLiveHint: "Luồng camera đang trực tiếp.", cameraWaitingHint: "Đang chờ khung hình camera.", cameraAlt: "Luồng camera RoboDog", restartCamera: "Khởi động lại camera", cameraRestartRequested: "Đã yêu cầu khởi động lại camera.", faceGateRequired: "Yêu cầu khuôn mặt quen", faceGateOpen: "Cho phép mọi khuôn mặt", faceGateRequiredHint: "Cử chỉ cần có khuôn mặt quen", faceGateOpenHint: "Có thể dùng cử chỉ mà không cần khuôn mặt quen", faceGateRequiredNotice: "Đã bật yêu cầu khuôn mặt quen.", faceGateOpenNotice: "Đã tắt yêu cầu khuôn mặt quen.", controlMode: "Chế độ điều khiển", manualButton: "Thủ công", automaticButton: "Tự động", connectingNotice: "Bảng điều khiển đang kết nối với UNO Q.", dashboardControlActive: "Đã kích hoạt điều khiển bằng bảng.", automaticRestored: "Đã khôi phục điều khiển tự động.", dashboardBusy: "Bảng điều khiển đang được thiết bị khác sử dụng.", bluetoothOwns: "Bluetooth đang giữ quyền điều khiển thủ công.", acceptedCommand: "Đã nhận: {command}", requestFailed: "Yêu cầu thất bại ({status})", robotControls: "Điều khiển robot", movementHold: "Nhấn & giữ", forward: "Tiến", turnLeft: "Quay trái", stop: "DỪNG", turnRight: "Quay phải", strafeLeft: "Ngang trái", backward: "Lùi", strafeRight: "Ngang phải", postures: "Tư thế", stand: "Đứng", sit: "Ngồi", prone: "Nằm", hold: "Giữ", bounce: "Nhún", cameraUp: "Lên", cameraDown: "Xuống", space: "Phím cách", ballDetection: "Phát hiện bóng", ballInactive: "Không hoạt động", ballSearching: "Đang tìm", ballTracking: "Đang theo dõi bóng", ballFound: "Đã thấy bóng", ballLost: "Mất bóng", ballNotFound: "Không tìm thấy bóng", detectedObjects: "Vật thể phát hiện", noObjects: "Không phát hiện vật thể", neutral: "Trung tâm", stopScan: "Dừng quét", status: "Trạng thái", control: "Điều khiển", robotState: "Trạng thái robot", face: "Khuôn mặt", hand: "Bàn tay", faceFamiliar: "Quen thuộc", faceUnfamiliar: "Không quen", faceNone: "Chưa phát hiện", lastCommand: "Lệnh cuối", scan: "Quét camera", cameraHealth: "Luồng camera", cameraRestarts: "Số lần khởi động lại", cameraRestartReason: "Lần khởi động cuối", cameraPath: "Thiết bị camera", noErrors: "Không có lỗi.", detected: "Đã phát hiện", notDetected: "Chưa phát hiện" }
      };
      const state = { status: null, holdButton: null, holdTimer: null, keyboardButton: null, language: null, released: false };
      const $ = (id) => document.getElementById(id);
      const buttons = () => Array.from(document.querySelectorAll("button[data-command]"));
      const commandKeys = { forward: "forward", backward: "backward", turn_left: "turnLeft", turn_right: "turnRight", crab_left: "strafeLeft", crab_right: "strafeRight", stop: "stop", stand: "stand", sit: "sit", prone: "prone", hold: "hold", bounce: "bounce", camera_up: "cameraUp", camera_down: "cameraDown" };
      function t(key, replacements = {}) { let value = (translations[state.language] || translations.en)[key] || translations.en[key] || key; Object.entries(replacements).forEach(([name, replacement]) => { value = value.replace(`{${name}}`, String(replacement)); }); return value; }
      function commandLabel(command) { return t(commandKeys[String(command || "").toLowerCase()] || String(command || "—")); }
      function applyLanguage() { document.documentElement.lang = state.language; document.title = t("title"); document.querySelectorAll("[data-i18n]").forEach((element) => { element.textContent = t(element.dataset.i18n); }); $("language-button").textContent = t("switchLanguage"); $("language-button").setAttribute("aria-label", t("switchLanguageAria")); $("connection-strip").setAttribute("aria-label", t("connectionStatus")); $("camera-image").alt = t("cameraAlt"); if (state.status) renderStatus(state.status); else showNotice(t("connectingNotice")); }
      function showNotice(message, kind = "") { const notice = $("notice"); notice.textContent = message; notice.className = `notice ${kind}`; }
      async function postJson(path, payload) { const response = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }); let result = {}; try { result = await response.json(); } catch (_) {} if (!response.ok) { const error = new Error(result.code === "dashboard_busy" ? t("dashboardBusy") : result.message || t("requestFailed", { status: response.status })); error.code = result.code; throw error; } return result; }
      async function sendCommand(command) { try { const result = await postJson("/api/command", { command }); showNotice(t("acceptedCommand", { command: commandLabel(result.command || command) }), "ok"); await refreshStatus(); } catch (error) { showNotice(error.message, "error"); } }
      async function restartCamera() { try { await postJson("/api/camera/restart", {}); showNotice(t("cameraRestartRequested"), "ok"); await refreshStatus(); } catch (error) { showNotice(error.message, "error"); } }
      async function setFaceGateRequirement(required) { try { const result = await postJson("/api/face-gate", { require_familiar_face: required }); showNotice(t(result.require_familiar_face ? "faceGateRequiredNotice" : "faceGateOpenNotice"), "ok"); await refreshStatus(); } catch (error) { showNotice(error.message, "error"); } }
      async function setMode(mode) { try { const result = await postJson("/api/mode", { mode }); showNotice(result.mode === "dashboard" ? t("dashboardControlActive") : t("automaticRestored"), "ok"); await refreshStatus(); } catch (error) { showNotice(error.message, "error"); await refreshStatus(); } }
      function formatControlMode(value) { const keys = { automatic: "automatic", "manual-dashboard": "dashboard", "manual-bluetooth": "bluetooth", "manual-unknown": "manual" }; return t(keys[String(value || "unknown")] || "unknown"); }
      function formatFaceStatus(value) { const keys = { familiar: "faceFamiliar", unfamiliar: "faceUnfamiliar", none: "faceNone" }; return t(keys[String(value || "none").toLowerCase()] || "unknown"); }
      function formatBallDetectionStatus(value) { const keys = { inactive: "ballInactive", searching: "ballSearching", tracking: "ballTracking", found: "ballFound", lost: "ballLost", not_found: "ballNotFound" }; return t(keys[String(value || "inactive").toLowerCase()] || "unknown"); }
      function renderFaceGate(data) { const button = $("face-gate-toggle-button"); if (!button) return; const required = data.require_familiar_face !== false; const label = button.querySelector(".control-label"); if (label) label.textContent = t(required ? "faceGateRequired" : "faceGateOpen"); button.setAttribute("aria-pressed", String(required)); button.setAttribute("title", t(required ? "faceGateRequiredHint" : "faceGateOpenHint")); }
      function renderBallDetection(data) {
        const active = data.ball_detection_active === true;
        const status = active ? String(data.ball_detection_status || "searching").toLowerCase() : "inactive";
        const statusClass = { searching: "warning", tracking: "good", found: "good", lost: "warning", not_found: "danger" }[status] || "";
        $("ball-detection-state").textContent = formatBallDetectionStatus(status); $("ball-detection-state").className = `pill ${statusClass}`;
        const objects = active && Array.isArray(data.ball_detection_objects) ? data.ball_detection_objects : [];
        const objectList = $("ball-detection-objects"); objectList.replaceChildren();
        if (!objects.length) { const empty = document.createElement("span"); empty.className = "object-empty"; empty.textContent = t("noObjects"); objectList.append(empty); return; }
        objects.forEach((object) => { const chip = document.createElement("span"); chip.className = "object-chip"; const label = document.createElement("span"); label.textContent = String(object && object.label || "—"); chip.append(label); const confidence = Number(object && object.confidence); if (Number.isFinite(confidence)) { const score = document.createElement("span"); score.className = "object-confidence"; score.textContent = `${Math.round(Math.max(0, Math.min(1, confidence)) * 100)}%`; chip.append(score); } objectList.append(chip); });
      }
      function renderStatus(data) {
        state.status = data;
        const dashboardActive = data.control_mode === "manual-dashboard";
        const bluetoothActive = data.control_mode === "manual-bluetooth";
        $("connection-pill").textContent = t("connected"); $("connection-pill").className = "pill good";
        $("mode-pill").textContent = formatControlMode(data.control_mode); $("mode-pill").className = `pill ${dashboardActive ? "good" : bluetoothActive ? "warning" : ""}`;
        const cameraLive = data.camera_live !== false; const cameraError = data.camera_error || ""; $("camera-state").textContent = cameraLive ? t("live") : t("waiting"); $("camera-state").className = `pill ${cameraLive ? "good" : cameraError ? "danger" : ""}`; $("camera-hint").textContent = cameraLive ? t("cameraLiveHint") : t("cameraWaitingHint");
        const faceStatus = String(data.face_status || "none").toLowerCase(); $("detection-face").textContent = formatFaceStatus(faceStatus); $("detection-face").className = `detection-value ${faceStatus === "familiar" ? "good" : faceStatus === "unfamiliar" ? "warning" : ""}`; $("detection-hand").textContent = data.hand_detected ? t("detected") : t("notDetected"); $("detection-hand").className = `detection-value ${data.hand_detected ? "good" : ""}`;
        renderFaceGate(data);
        renderBallDetection(data);
        buttons().forEach((button) => { button.disabled = !dashboardActive; }); $("manual-button").disabled = dashboardActive || bluetoothActive; $("automatic-button").disabled = data.control_mode === "automatic";
        // Bảo trì camera và cài đặt face gate an toàn ở cả hai chế độ.
        $("camera-restart-button").disabled = false; $("face-gate-toggle-button").disabled = false;
        if (bluetoothActive) showNotice(t("bluetoothOwns"));
      }
      async function refreshStatus() { try { const response = await fetch("/api/status", { cache: "no-store" }); let result = {}; try { result = await response.json(); } catch (_) {} if (!response.ok) { const error = new Error(result.code === "dashboard_busy" ? t("dashboardBusy") : result.message || t("requestFailed", { status: response.status })); error.code = result.code; throw error; } renderStatus(result); } catch (error) { const busy = error.code === "dashboard_busy"; $("connection-pill").textContent = busy ? t("inUse") : t("offline"); $("connection-pill").className = `pill ${busy ? "warning" : "danger"}`; showNotice(error.message, "error"); } }
      function beginHold(button, event) { event.preventDefault(); if (button.disabled || state.holdButton) return; state.holdButton = button; button.classList.add("active"); if (button.setPointerCapture && event.pointerId !== undefined) button.setPointerCapture(event.pointerId); sendCommand(button.dataset.command); state.holdTimer = setInterval(() => sendCommand(button.dataset.command), 400); }
      function endHold(button) { if (state.holdButton !== button) return; clearInterval(state.holdTimer); state.holdTimer = null; state.holdButton.classList.remove("active"); state.holdButton = null; sendCommand("stop"); }
      function stopEverything() { if (state.holdButton) endHold(state.holdButton); else sendCommand("stop"); }
      buttons().forEach((button) => { if (button.classList.contains("hold-control")) { button.addEventListener("pointerdown", (event) => beginHold(button, event)); ["pointerup", "pointercancel", "pointerleave"].forEach((name) => button.addEventListener(name, () => endHold(button))); } else button.addEventListener("click", () => button.dataset.command === "stop" ? stopEverything() : sendCommand(button.dataset.command)); });
      $("manual-button").addEventListener("click", () => setMode("manual")); $("automatic-button").addEventListener("click", () => setMode("automatic")); $("camera-restart-button").addEventListener("click", restartCamera); $("face-gate-toggle-button").addEventListener("click", () => { const currentlyRequired = !state.status || state.status.require_familiar_face !== false; setFaceGateRequirement(!currentlyRequired); }); $("language-button").addEventListener("click", () => { state.language = state.language === "en" ? "vi" : "en"; try { localStorage.setItem("robodog-language", state.language); } catch (_) {} applyLanguage(); });
      const keyboardCommands = { w: "forward", a: "turn_left", s: "backward", d: "turn_right", q: "crab_left", e: "crab_right", x: "stand", c: "sit", v: "prone", z: "hold", b: "bounce", i: "camera_up", k: "camera_down" };
      window.addEventListener("keydown", (event) => { if (event.target && ["INPUT", "TEXTAREA", "SELECT"].includes(event.target.tagName)) return; if (event.code === "Space") { event.preventDefault(); if (!event.repeat) stopEverything(); return; } const command = keyboardCommands[event.key.toLowerCase()]; if (!command || event.repeat) return; const button = buttons().find((item) => item.dataset.command === command); if (!button) return; if (button.classList.contains("hold-control")) { state.keyboardButton = button; beginHold(button, event); } else sendCommand(command); });
      window.addEventListener("keyup", (event) => { if (state.keyboardButton && "wasdqe".includes(event.key.toLowerCase())) { endHold(state.keyboardButton); state.keyboardButton = null; } }); window.addEventListener("blur", stopEverything); document.addEventListener("visibilitychange", () => { if (document.hidden) stopEverything(); });
      function releaseDashboard() { if (state.released) return; state.released = true; if (state.holdButton) { clearInterval(state.holdTimer); state.holdTimer = null; state.holdButton.classList.remove("active"); state.holdButton = null; state.keyboardButton = null; if (navigator.sendBeacon) navigator.sendBeacon("/api/command", new Blob([JSON.stringify({ command: "stop" })], { type: "application/json" })); } const body = new Blob(["{}"], { type: "application/json" }); if (!navigator.sendBeacon || !navigator.sendBeacon("/api/release", body)) fetch("/api/release", { method: "POST", body, keepalive: true }).catch(() => {}); }
      let saved = null; try { saved = localStorage.getItem("robodog-language"); } catch (_) {} state.language = saved === "vi" || saved === "en" ? saved : (String(navigator.language || "").toLowerCase().startsWith("vi") ? "vi" : "en"); applyLanguage(); refreshStatus(); setInterval(refreshStatus, 1000); window.addEventListener("pagehide", releaseDashboard);
    })();
  </script>
